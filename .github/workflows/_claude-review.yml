# PUBLIC-REPO MIRROR (zsh-github-dark). A public repository cannot use a
# PRIVATE repository's reusable workflows — GitHub forbids it regardless of
# the org Actions access setting (discovered 2026-08-16: every cross-repo
# call here died as a startup_failure with an opaque banner). Hence this
# local mirror.
# Unified PR reviewer + blocking merge gate.
#
# This is a MIRRORED COPY of the reusable job in
# yellow-pine/ai-runner-stack/.github/workflows/reusable-code-review.yml
# (a private repo's reusable cannot be `uses:`-called from here —
# GitHub limitation). If that workflow changes, re-mirror this file.
# The upstream watchdog compares the line below against the current blob of
# the reusable and pages when a re-mirror is due — update it when re-mirroring:
# mirrored-from-blob: 062265e5fa05f7d1440128e5b01d71310a15c510
#
# The engine is the runner stack's `review` gate. WHICH agent reviews is the
# REVIEW_AGENT variable. Org policy (2026-08-30): PUBLIC repos review on
# Claude Code, PRIVATE repos on the local model — so this repo carries a
# repo-level REVIEW_AGENT=claude variable, and the CLAUDE_CODE_OAUTH_TOKEN
# org secret must have all-repositories visibility to reach a public repo.
# The caller MUST pass `secrets: inherit` or the reviewer runs
# unauthenticated and fails every PR closed. Fork PRs never receive secrets
# and the same-repo guard below skips them before runner assignment.
# `review --gate` posts exactly one verdict-stamped review comment and exits
# fail-closed: 0 = PASS, 2 = FAIL (blocks the merge), 1 = no comment landed.
# Anything unparseable or errored is a FAIL — closed, never open.
#
# REUSABLE so the draft gate can sit on the CALLER (claude-review.yml): a
# skipped `uses:` job never instantiates this workflow, so a draft-triggered
# run publishes NO check runs (a skipped inline job would publish the required
# context as `skipped`, which branch protection counts as PASSED).
#
# ⚠️ The check context is `claude-review / PR review` (caller job id `claude` + the
# job name below). It is a ruleset-REQUIRED check: renaming either side
# deadlocks every PR until the ruleset is updated in the same window.
name: _claude-review

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: "Claude Code OAuth token for the hosted claude paradigm this public repo runs on. Reaches this repo only while the org secret has all-repositories visibility; delivered by the caller via secrets: inherit."
        required: false

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: PR review
    runs-on: self-hosted
    # Skip fork PRs (a self-hosted runner must never execute fork-PR code) and
    # Dependabot. Both conditions are STABLE (a fork stays a fork), so the
    # skipped-equals-green conclusion can't later mask a real one. The DRAFT
    # gate lives on the caller instead, because draft flips on the same SHA.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    # Pre-flight may wait out a vLLM cold start (15 min) + agentic attempts
    # (3x180s) + bounded salvage consolidation (10 min).
    timeout-minutes: 36
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      # Reviewer paradigm, resolved from this repo's/org's variables. Here the
      # repo-level REVIEW_AGENT=claude selects the hosted paradigm (see
      # header); the token arrives through the caller's `secrets: inherit`.
      REVIEW_AGENT: ${{ vars.REVIEW_AGENT }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      # The diff and the comment travel over the API; the checkout only gives
      # `gh` its repo context, so shallow is enough.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # The runner image ships the `review` console script; the model server
      # address and LOCAL_MODEL arrive from the runner environment. This probe
      # proves the server serves the model AND accepts tools + reasoning.
      # On the hosted paradigm the script skips this itself — no local
      # dependency to wait for.
      - name: Model server pre-flight
        run: review --preflight

      - name: Local review + fail-closed verdict gate
        run: review --gate "${PR_NUMBER}"
