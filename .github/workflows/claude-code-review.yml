# PR review — BLOCKING (org policy 2026-08-15: never advisory). The engine is
# the org runner stack's `review --gate` via the local mirror of the reusable
# workflow (_claude-review.yml). WHICH agent reviews is the REVIEW_AGENT
# variable — org policy 2026-08-30: PUBLIC repos review on Claude Code (this
# repo carries REVIEW_AGENT=claude), PRIVATE repos on the local model.
#
# PUBLIC-REPO POSTURE, deliberately layered:
#   1. This repo requires approval for workflow runs from ALL outside
#      collaborators (Actions setting, 2026-08-15), so fork-PR workflows never
#      run unapproved.
#   2. The reusable's inner job carries a same-repo guard evaluated by GitHub
#      BEFORE runner assignment: even an approved fork PR skips this job, so
#      fork code never reaches the self-hosted runners — and fork PRs never
#      receive secrets in any case.
#   3. CI (continuous-integration.yml) deliberately stays on GitHub-hosted
#      runners — free for public repos, and it keeps approved fork CI runs off
#      our hardware entirely. Only this same-repo-guarded review job is
#      self-hosted.
#
# ⚠️ Check-context contract: caller job id `claude-review` + inner job
# "PR review" publish `claude-review / PR review`; the ruleset's
# required-checks list carries exactly that name.
name: Claude Code Review

on:
    pull_request:
        # reopened + ready_for_review are load-bearing WITH the draft gate: a
        # draft marked ready without a new push must still mint the required
        # check, or the PR blocks forever on 'expected'. (Flagged by the
        # claude gate on the draft-guard PR itself; same list as grove/bly.)
        types: [opened, reopened, ready_for_review, synchronize]

jobs:
    claude-review:
        # Draft gate on the CALLER (see the mirror's header): a skipped
        # `uses:` job never instantiates the reusable, so a draft publishes
        # NO check runs — not a green `skipped` that branch protection
        # counts as passed. Flagged by this repo's own first Claude review.
        if: ${{ github.event.pull_request.draft == false }}
        uses: ./.github/workflows/_claude-review.yml
        # Delivers CLAUDE_CODE_OAUTH_TOKEN to the mirror — load-bearing on
        # the claude paradigm; without it the reviewer runs unauthenticated
        # and fails every PR closed.
        secrets: inherit
        permissions:
            contents: read
            pull-requests: write
